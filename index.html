
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#091540">
  <link rel="manifest" href="./manifest.json">
  <title>Android Notification Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #091540;
      color: white;
      text-align: center;
      padding: 40px 16px;
    }
    button {
      background: #7692FF;
      color: #091540;
      border: 0;
      padding: 14px 22px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      margin: 8px;
    }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h2>Android Notification Test</h2>
  <p>Test notifications on your Android phone.</p>
  <button id="notify">Enable & Send Notification</button>
  <p id="status">Checking browser support...</p>

  <script>
    const status = document.getElementById("status");
    const button = document.getElementById("notify");

    async function setupWorker() {
      if (!("serviceWorker" in navigator)) {
        throw new Error("Service workers are not supported. Use Chrome.");
      }

      const registration = await navigator.serviceWorker.register(
        "./sw.js"
      );

      await navigator.serviceWorker.ready;
      return registration;
    }

    setupWorker()
      .then(() => {
        status.textContent = "Ready. Tap the button to test.";
      })
      .catch(error => {
        status.textContent = "Setup error: " + error.message;
      });

    button.addEventListener("click", async () => {
      button.disabled = true;
      status.textContent = "Requesting notification permission...";

      try {
        const registration = await setupWorker();

        if (!("Notification" in window)) {
          throw new Error("This browser does not support notifications.");
        }

        let permission = Notification.permission;

        if (permission === "default") {
          permission = await Notification.requestPermission();
        }

        if (permission !== "granted") {
          throw new Error(
            "Notifications are blocked. Allow them in Chrome site settings."
          );
        }

        await registration.showNotification("SKTC Notification", {
          body: "Hello! This is a notification.",
          silent: false,
          renotify: true
        });

        status.textContent = "Notification sent to this browser.";
      } catch (error) {
        status.textContent = "Error: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
    </html>
