<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android Notifications</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #091540;
      color: white;
      text-align: center;
      padding: 40px 16px;
    }
    button {
      background: #7692FF;
      color: #091540;
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
    }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h2>SKTC Notifications</h2>
  <p>Test your Android notification sound.</p>
  <button id="notify">Enable & Send Notification</button>
  <p id="status">Ready</p>

  <script>
    const status = document.getElementById("status");
    const button = document.getElementById("notify");

    async function sendNotification() {
      button.disabled = true;

      try {
        if (!("Notification" in window)) {
          throw new Error("Notifications are not supported.");
        }

        if (!("serviceWorker" in navigator)) {
          throw new Error("Service workers are not supported.");
        }

        const registration = await navigator.serviceWorker.register("./sw.js");
        await navigator.serviceWorker.ready;

        let permission = Notification.permission;

        if (permission === "default") {
          permission = await Notification.requestPermission();
        }

        if (permission !== "granted") {
          throw new Error("Allow notifications in Chrome site settings.");
        }

        await registration.showNotification("SKTC Notification", {
          body: "Hello! This is a notification.",
          silent: false
        });

        status.textContent = "Notification sent. Check your notification panel.";
      } catch (error) {
        status.textContent = "Error: " + error.message;
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", sendNotification);
  </script>
</body>
</html>
